{% extends "base.html" %}
{% block titulo_pagina %}Configuración{% endblock %}
{% block content %}

<h1><i class="bi bi-gear"></i> Configuración del Sistema</h1>

<div class="row mt-4">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-shop display-4 text-primary"></i>
                <h4 class="mt-3">Configuración de Tienda</h4>
                <p class="text-muted">Nombre, contacto y datos de la tienda</p>
                <a href="{{ url_for('configuracion.tienda') }}" class="btn btn-primary">
                    <i class="bi bi-pencil"></i> Configurar
                </a>
            </div>
        </div>
    </div>
    
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-box-seam display-4 text-warning"></i>
                <h4 class="mt-3">Alertas de Stock</h4>
                <p class="text-muted">Configurar umbrales de alertas de inventario</p>
                <a href="{{ url_for('configuracion.stock') }}" class="btn btn-warning">
                    <i class="bi bi-sliders"></i> Configurar
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
