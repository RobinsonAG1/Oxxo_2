{% extends "base.html" %}
{% block titulo_pagina %}Configuración de Tienda{% endblock %}
{% block content %}

<h1><i class="bi bi-shop"></i> Configuración de Tienda</h1>

<div class="card mt-4">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="nombre_tienda" class="form-label">Nombre de la Tienda</label>
                <input type="text" class="form-control" id="nombre_tienda" name="nombre_tienda" value="{{ nombre_tienda }}" required>
            </div>
            <div class="mb-3">
                <label for="email_contacto" class="form-label">Email de Contacto</label>
                <input type="email" class="form-control" id="email_contacto" name="email_contacto" value="{{ email_contacto }}">
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" value="{{ telefono }}">
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <textarea class="form-control" id="direccion" name="direccion" rows="3">{{ direccion }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="{{ url_for('configuracion.index') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
