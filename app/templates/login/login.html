{% extends "base.html" %}

{% block titulo_pagina %}Bienvenido a la Tienda OXXO{% endblock %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-danger text-white text-center">
                        <h1 class="h4"><i class="bi bi-shop"></i> Iniciar sesión</h1>
                    </div>
                    <div class="card-body">
                        <form method="post" action="{{ url_for('auth.login') }}">
                            <div class="form-group mb-3">
                                <label for="nameUser" class="form-label">Usuario</label>
                                <input type="text" name="nameUser" id="nameUser" class="form-control" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="passwordUser" class="form-label">Contraseña</label>
                                <input type="password" name="passwordUser" id="passwordUser" class="form-control" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-block">
                                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                                </button>
                            </div>
                        </form>
                        <hr class="my-3">
                        <div class="text-center small text-muted">
                            <p>Usuarios de ejemplo:</p>
                            <p><strong>admin</strong> / admin123 (administrador)</p>
                            <p><strong>cliente</strong> / cliente123 (cliente)</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
