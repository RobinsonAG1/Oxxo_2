{% extends "base.html" %}
{% block titulo_pagina %}Dashboard{% endblock %}
{% block content %}

<div class="text-center">
    <h1><i class="bi bi-person"></i> ¡Bienvenido, {{ current_user.nameUser }}!</h1>
    <p class="text-muted">Explora la tienda y haz tus pedidos.</p>
    <div class="d-flex justify-content-center gap-2 mt-3">
        <a href="{{ url_for('tienda.index') }}" class="btn btn-danger btn-lg">
            <i class="bi bi-shop"></i> Ir a la tienda
        </a>
        <a href="{{ url_for('pedido.mis_pedidos') }}" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-box-seam"></i> Mis pedidos
        </a>
    </div>
</div>

{% endblock %}
