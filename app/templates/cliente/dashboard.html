{% extends "base.html" %}
{% block titulo_pagina %}Dashboard{% endblock %}
{% block content %}

<div class="center">
    <h1 class="welcome"><i class="bi bi-person" aria-hidden="true"></i> ¡Bienvenido, {{ current_user.nameUser }}!</h1>
    <p class="muted">Explora la tienda y haz tus pedidos.</p>
    <div class="flex mt-3" style="justify-content: center; gap: .8rem;">
        <a href="{{ url_for('tienda.index') }}" class="btn btn-red btn-lg">
            <i class="bi bi-shop" aria-hidden="true"></i> Ir a la tienda
        </a>
        <a href="{{ url_for('pedido.mis_pedidos') }}" class="btn btn-outline-black btn-lg">
            <i class="bi bi-box-seam" aria-hidden="true"></i> Mis pedidos
        </a>
    </div>
</div>

{% endblock %}
