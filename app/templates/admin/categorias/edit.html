{% extends "base.html" %}
{% block titulo_pagina %}Editar Categoría: {{ categoria.nombre }}{% endblock %}
{% block content %}
<form action="{{ url_for('categoria.edit', id=categoria.idCategoria) }}" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="form-group mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" required
               value="{{ valores.get('nombre', '') }}" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="descripcion" class="form-label">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3" maxlength="255" class="form-control">{{ valores.get('descripcion', '') }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg"></i> Actualizar Categoría
    </button>
    <a href="{{ url_for('categoria.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
</form>
{% endblock %}
