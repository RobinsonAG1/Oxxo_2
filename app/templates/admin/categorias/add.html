{% extends "base.html" %}
{% block titulo_pagina %}Agregar Categoría{% endblock %}
{% block content %}
<form action="{{ url_for('categoria.add') }}" method="post" class="needs-validation" novalidate>
    <div class="form-group mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required class="form-control">
        <div class="invalid-feedback">
            Por favor, ingrese el nombre de la categoría.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="descripcion" class="form-label">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3" class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg"></i> Crear Categoría
    </button>
    <a href="{{ url_for('categoria.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
</form>

{% endblock %}
