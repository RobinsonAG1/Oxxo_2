{% extends "base.html" %}
{% block titulo_pagina %}Nuevo Usuario{% endblock %}
{% block content %}
<form action="{{ url_for('usuario.add') }}" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="form-group mb-3">
        <label for="nameUser" class="form-label">Nombre de usuario:</label>
        <input type="text" id="nameUser" name="nameUser" maxlength="80" required
               value="{{ valores.get('nameUser', '') }}" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" id="email" name="email" maxlength="120" required
               value="{{ valores.get('email', '') }}" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="rol" class="form-label">Rol:</label>
        <select id="rol" name="rol" required class="form-select">
            {% for rol in roles %}
                <option value="{{ rol }}" {% if rol == valores.get('rol', 'cliente') %}selected{% endif %}>{{ rol }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="passwordUser" class="form-label">Contraseña:</label>
                <input type="password" id="passwordUser" name="passwordUser" minlength="6" required class="form-control">
                <div class="form-text">Mínimo 6 caracteres.</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="passwordConfirm" class="form-label">Repetir contraseña:</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" minlength="6" required class="form-control">
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg"></i> Crear Usuario
    </button>
    <a href="{{ url_for('usuario.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
</form>
{% endblock %}
