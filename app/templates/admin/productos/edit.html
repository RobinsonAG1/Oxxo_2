{% extends "base.html" %}
{% block titulo_pagina %}Editar Producto: {{ producto.nombre }}{% endblock %}
{% block content %}
<form action="{{ url_for('producto.edit', id=producto.idProducto) }}" method="post">
    <div class="field">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" class="input" required>
    </div>

    <div class="field">
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3" class="textarea">{{ producto.descripcion or '' }}</textarea>
    </div>

    <div class="field">
        <label for="categoria_id">Categoría:</label>
        <select id="categoria_id" name="categoria_id" class="select" required>
            {% for categoria in categorias %}
                <option value="{{ categoria.idCategoria }}" {% if categoria.idCategoria == producto.categoria_id %}selected{% endif %}>
                    {{ categoria.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="grid-2">
        <div class="field">
            <label for="precio">Precio (MXN):</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" value="{{ producto.precio }}" class="input" required>
        </div>
        <div class="field">
            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" min="0" value="{{ producto.stock }}" class="input" required>
        </div>
    </div>

    <button type="submit" class="btn btn-black">
        <i class="bi bi-check-lg" aria-hidden="true"></i> Actualizar Producto
    </button>
    <a href="{{ url_for('producto.index') }}" class="btn btn-outline">Cancelar</a>
</form>

{% endblock %}
