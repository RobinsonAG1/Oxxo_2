{% extends "base.html" %}
{% block titulo_pagina %}Editar Producto: {{ producto.nombre }}{% endblock %}
{% block content %}
<form action="{{ url_for('producto.edit', id=producto.idProducto) }}" method="post" class="needs-validation" novalidate>
    <div class="form-group mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required class="form-control">
        <div class="invalid-feedback">
            Por favor, ingrese el nombre del producto.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="descripcion" class="form-label">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3" class="form-control">{{ producto.descripcion or '' }}</textarea>
    </div>

    <div class="form-group mb-3">
        <label for="categoria_id" class="form-label">Categoría:</label>
        <select id="categoria_id" name="categoria_id" required class="form-control">
            {% for categoria in categorias %}
                <option value="{{ categoria.idCategoria }}" {% if categoria.idCategoria == producto.categoria_id %}selected{% endif %}>
                    {{ categoria.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="precio" class="form-label">Precio (MXN):</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0" value="{{ producto.precio }}" required class="form-control">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="stock" class="form-label">Stock:</label>
                <input type="number" id="stock" name="stock" min="0" value="{{ producto.stock }}" required class="form-control">
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg"></i> Actualizar Producto
    </button>
    <a href="{{ url_for('producto.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
</form>

{% endblock %}
